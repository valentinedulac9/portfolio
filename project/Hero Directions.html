<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine Dulac — Directions Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,600&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }

  /* ============ HERO A — L'Éditorial (light serif) ============ */
  .heroA {
    width: 100%; height: 100%;
    background: #faf9f7;
    color: #1a1a1a;
    position: relative;
    overflow: hidden;
    font-family: 'Hanken Grotesk', sans-serif;
    padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .heroA .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .heroA .brandmark { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
  .heroA .nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #1a1a1a; }
  .heroA .nav span { opacity: .55; }
  .heroA .center { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px; }
  .heroA .eyebrow { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #7a6f9b; margin-bottom: 22px; }
  .heroA h1 { font-family: 'Newsreader', serif; font-weight: 400; font-size: 128px; line-height: .92; letter-spacing: -.02em; margin: 0; }
  .heroA h1 em { font-style: italic; }
  .heroA h1 .lav { color: #7a6f9b; }
  .heroA .tag { font-size: 21px; line-height: 1.45; max-width: 460px; margin: 30px 0 34px; color: #423e44; }
  .heroA .ctas { display: flex; gap: 14px; }
  .heroA .btn { font-size: 14px; letter-spacing: .04em; padding: 15px 28px; border-radius: 999px; border: 1.5px solid #1a1a1a; cursor: pointer; font-weight: 600; }
  .heroA .btn.solid { background: #1a1a1a; color: #faf9f7; }
  .heroA .btn.ghost { background: transparent; color: #1a1a1a; }
  .heroA .photowrap { position: relative; }
  .heroA .photowrap .ring { position: absolute; inset: -22px; border-radius: 50%; border: 1.5px solid #7a6f9b; }
  .heroA .photowrap img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; display: block; }
  .heroA .footline { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8a8590; }

  /* ============ HERO B — Le Split (grotesque + color block) ============ */
  .heroB {
    width: 100%; height: 100%;
    display: grid; grid-template-columns: 1.15fr .85fr;
    font-family: 'Hanken Grotesk', sans-serif;
    overflow: hidden;
    background: #faf9f7; color: #1a1a1a;
  }
  .heroB .left { padding: 54px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .heroB .eyebrow { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #7a6f9b; }
  .heroB h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 96px; line-height: .9; letter-spacing: -.03em; margin: 26px 0 0; }
  .heroB .tag { font-size: 22px; line-height: 1.4; max-width: 440px; margin: 28px 0 0; color: #423e44; font-weight: 500; }
  .heroB .ctas { display: flex; gap: 14px; margin-top: 34px; }
  .heroB .btn { font-size: 14px; letter-spacing: .04em; padding: 16px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
  .heroB .btn.solid { background: #7a6f9b; color: #fff; }
  .heroB .btn.ghost { background: transparent; color: #1a1a1a; border: 1.5px solid #d6d0da; }
  .heroB .meta { display: flex; gap: 44px; }
  .heroB .meta .n { font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; }
  .heroB .meta .l { font-size: 13px; color: #8a8590; margin-top: 6px; letter-spacing: .02em; }
  .heroB .right { background: #7a6f9b; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .heroB .right::before { content: ""; position: absolute; width: 460px; height: 460px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
  .heroB .right::after { content: "VALENTINE"; position: absolute; bottom: 28px; right: -10px; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 84px; color: rgba(255,255,255,.12); letter-spacing: -.03em; }
  .heroB .right img { width: 340px; height: 340px; border-radius: 50%; object-fit: cover; position: relative; box-shadow: 0 30px 70px rgba(0,0,0,.25); }

  /* ============ HERO C — L'Affiche (dark poster, expanded type) ============ */
  .heroC {
    width: 100%; height: 100%;
    background: #16151a; color: #f4f1ee;
    position: relative; overflow: hidden;
    font-family: 'Hanken Grotesk', sans-serif;
    display: flex; flex-direction: column;
  }
  .heroC .glow { position: absolute; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(122,111,155,.45), transparent 62%); top: -260px; left: 50%; transform: translateX(-50%); filter: blur(8px); }
  .heroC .topbar { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 34px 56px; }
  .heroC .brandmark { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #b8aecb; }
  .heroC .nav { display: flex; gap: 28px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .heroC .stage { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px; }
  .heroC .eyebrow { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: #b8aecb; margin-bottom: 26px; }
  .heroC h1 { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 116px; line-height: .86; letter-spacing: -.02em; text-transform: uppercase; margin: 0; font-stretch: 125%; }
  .heroC h1 .lav { color: #a99bc6; }
  .heroC .photo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 0 0 -18px; position: relative; z-index: 2; border: 3px solid #16151a; box-shadow: 0 0 0 1px rgba(184,174,203,.4); }
  .heroC .tag { font-size: 20px; line-height: 1.5; max-width: 540px; margin: 30px auto 0; color: #c9c4cf; }
  .heroC .ctas { display: flex; gap: 14px; justify-content: center; margin-top: 32px; }
  .heroC .btn { font-size: 14px; letter-spacing: .04em; padding: 15px 30px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .heroC .btn.solid { background: #a99bc6; color: #16151a; border: none; }
  .heroC .btn.ghost { background: transparent; color: #f4f1ee; border: 1.5px solid rgba(244,241,238,.3); }
  .heroC .footline { position: relative; display: flex; justify-content: space-between; padding: 26px 56px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #6f6a78; border-top: 1px solid rgba(255,255,255,.07); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function HeroA() {
  return (
    <div className="heroA">
      <div className="topbar">
        <div className="brandmark">VD — Paris 75004</div>
        <div className="nav"><span>À propos</span><span>Expériences</span><span>Compétences</span><span>Contact</span></div>
      </div>
      <div className="center">
        <div>
          <div className="eyebrow">Chef de projet communication &amp; digital</div>
          <h1>Valentine<br/><em className="lav">Dulac</em></h1>
          <p className="tag">Je transforme les idées en campagnes qui performent.</p>
          <div className="ctas">
            <button className="btn solid">Voir mes projets</button>
            <button className="btn ghost">Me contacter</button>
          </div>
        </div>
        <div className="photowrap">
          <div className="ring"></div>
          <img src="assets/valentine.png" alt="Valentine Dulac" />
        </div>
      </div>
      <div className="footline"><span>3 ans d'expérience</span><span>Disponible — CDI / Freelance</span></div>
    </div>
  );
}

function HeroB() {
  return (
    <div className="heroB">
      <div className="left">
        <div className="eyebrow">Chef de projet communication &amp; digital · Paris</div>
        <div>
          <h1>Des idées<br/>qui<br/>performent.</h1>
          <p className="tag">Stratège créative et chef de projet. Je pilote vos campagnes digitales de la réflexion à la performance.</p>
          <div className="ctas">
            <button className="btn solid">Voir mes projets</button>
            <button className="btn ghost">Me contacter</button>
          </div>
        </div>
        <div className="meta">
          <div><div className="n">3</div><div className="l">ans d'expérience</div></div>
          <div><div className="n">5+</div><div className="l">clients accompagnés</div></div>
          <div><div className="n">∞</div><div className="l">campagnes pilotées</div></div>
        </div>
      </div>
      <div className="right">
        <img src="assets/valentine.png" alt="Valentine Dulac" />
      </div>
    </div>
  );
}

function HeroC() {
  return (
    <div className="heroC">
      <div className="glow"></div>
      <div className="topbar">
        <div className="brandmark">Valentine Dulac</div>
        <div className="nav"><span>À propos</span><span>Expériences</span><span>Compétences</span><span>Contact</span></div>
      </div>
      <div className="stage">
        <div className="eyebrow">Chef de projet communication &amp; digital</div>
        <img className="photo" src="assets/valentine.png" alt="Valentine Dulac" />
        <h1>VALENTINE<br/><span className="lav">DULAC</span></h1>
        <p className="tag">Je transforme les idées en campagnes qui performent — du brief stratégique à la mesure des résultats.</p>
        <div className="ctas">
          <button className="btn solid">Voir mes projets</button>
          <button className="btn ghost">Me contacter</button>
        </div>
      </div>
      <div className="footline"><span>Paris · 75004</span><span>Red Agency — Chef de Groupe Digital</span><span>Disponible</span></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DesignCanvas>
    <DCSection id="heroes" title="Directions Hero" subtitle="3 pistes — même palette lavande, registre audacieux. Choisis-en une (ou mixe).">
      <DCArtboard id="a" label="A · L'Éditorial — serif haute lisibilité, asymétrie" width={1280} height={720}><HeroA /></DCArtboard>
      <DCArtboard id="b" label="B · Le Split — grotesque massif + bloc lavande" width={1280} height={720}><HeroB /></DCArtboard>
      <DCArtboard id="c" label="C · L'Affiche — fond sombre, type expanded, photo centrée" width={1280} height={720}><HeroC /></DCArtboard>
    </DCSection>
  </DesignCanvas>
);
</script>
</body>
</html>
